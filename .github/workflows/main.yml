name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "build ya keystore"
        type: choice
        options: [build, keystore]
        default: build
      password:
        description: "Sirf mode=keystore ke liye: naya password (8+ letters/numbers)"
        required: false
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'push' || inputs.mode == 'build'
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Decode keystore
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          INTERAPI_KEY: ${{ secrets.INTERAPI_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease
      - name: Read version
        id: ver
        run: echo "code=$(grep -oP 'versionCode = \K[0-9]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk MsgSaver.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MsgSaver-apk
          path: MsgSaver.apk
      - name: Publish GitHub Release
        if: env.HAS_KEY == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.code }}
          name: MsgSaver v${{ steps.ver.outputs.code }}
          files: MsgSaver.apk
          make_latest: true

  keystore:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'keystore'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Generate keystore
        env:
          PASS: ${{ inputs.password }}
        run: |
          if [ ${#PASS} -lt 8 ]; then echo "Password kam se kam 8 characters ka rakho"; exit 1; fi
          keytool -genkeypair -keystore msgsaver.jks -alias msgsaver -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=MsgSaver, O=MsgSaver, C=PK"
          base64 -w 0 msgsaver.jks > keystore_base64.txt
      - uses: actions/upload-artifact@v4
        with:
          name: msgsaver-keystore
          path: |
            msgsaver.jks
            keystore_base64.txt
